<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2563eb" opacity="0.15"/>
  
  <!-- Calendar border -->
  <rect x="12" y="16" width="40" height="36" rx="3" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Calendar top bar -->
  <rect x="12" y="16" width="40" height="8" rx="3" fill="#2563eb"/>
  
  <!-- Calendar title text (simplified) -->
  <text x="32" y="25" font-size="5" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">2025</text>
  
  <!-- Grid lines for dates -->
  <line x1="12" y1="28" x2="52" y2="28" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="12" y1="36" x2="52" y2="36" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  
  <!-- Vertical grid lines -->
  <line x1="20" y1="28" x2="20" y2="52" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="28" y1="28" x2="28" y2="52" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="36" y1="28" x2="36" y2="52" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  <line x1="44" y1="28" x2="44" y2="52" stroke="#2563eb" stroke-width="1" opacity="0.3"/>
  
  <!-- Highlight one date -->
  <circle cx="32" cy="44" r="3.5" fill="#2563eb" opacity="0.8"/>
</svg>
